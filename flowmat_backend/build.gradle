plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'org.owasp.dependencycheck' version '13.0.0'
}

// The bounded-context modules (settings.gradle). Each declares its dependencies on the others in its own
// build.gradle, following the one-way order in docs/architecture/domain-map.md §4. The root project is the
// Spring Boot application that assembles them.
def contextModules = subprojects.findAll { it.path.startsWith(':modules:') }

allprojects {
	group = 'org.myweb'
	version = '0.0.1-SNAPSHOT'

	// Keep the client and core pair aligned; HTTP connectors use a pinned DNS resolver.
	ext['httpclient5.version'] = '5.6.3'
	ext['httpcore5.version'] = '5.4.3'

	repositories {
		mavenCentral()
	}
}

configure(contextModules) {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'

	// Unique jar names inside the Boot jar's BOOT-INF/lib.
	base {
		archivesName = "flowmat-${project.name}"
	}

	dependencyManagement {
		imports {
			mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		}
	}
}

configure([rootProject] + contextModules) {
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs += ['-parameters']
	}

	// The modules run in one Spring application, so they compile against the application's library set.
	dependencies {
		implementation 'org.apache.httpcomponents.client5:httpclient5'
		implementation 'org.flywaydb:flyway-core'
		implementation 'org.flywaydb:flyway-database-postgresql'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'
		implementation 'org.springframework.boot:spring-boot-starter-mail'
		implementation 'org.springframework.boot:spring-boot-starter-actuator'
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-web'
		implementation 'org.springframework.boot:spring-boot-starter-websocket'
		implementation 'io.micrometer:micrometer-registry-prometheus'

		implementation platform('software.amazon.awssdk:bom:2.59.5')
		implementation('software.amazon.awssdk:s3') {
			exclude group: 'software.amazon.awssdk', module: 'apache5-client'
			exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
		}
		implementation 'software.amazon.awssdk:url-connection-client'

		// API Documentation
		implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

		// JWT
		implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
		runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
		runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

		runtimeOnly 'org.postgresql:postgresql'

		compileOnly 'org.projectlombok:lombok'

		annotationProcessor 'org.projectlombok:lombok'
		annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	}
}

dependencies {
	contextModules.each { module ->
		implementation project(module.path)
	}

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	// Runs the flow kernel's WebAssembly module in the JVM for the ADR-040 decision 6 measurement (-Dflow.bench=true).
	testImplementation 'com.dylibso.chicory:runtime:1.7.5'
	testImplementation 'com.dylibso.chicory:compiler:1.7.5'
	testCompileOnly 'org.projectlombok:lombok'
	// The test impact filter and listener (src/test/java/org/myweb/flowmat/testimpact) use the launcher API.
	testImplementation 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// The integration suite retains several JPA/Redis contexts in one test JVM.
	maxHeapSize = '2g'
	systemProperty 'spring.test.context.cache.maxSize', '4'
	// -Ptest.forks=N runs N test JVMs side by side, each with its own Postgres and Redis (IntegrationTestSupport starts
	// them once per JVM). On a 4-core machine the suite took 438 s in one, 319 s in two and 339 s in three; on CI's
	// runner the test step took 8 m 8 s in one and 8 m 29 s in two (2026-11-21), so the default stays one.
	maxParallelForks = providers.gradleProperty('test.forks').map { it as int }.getOrElse(1)
	// The module catalog tests read these files, which are not on the test classpath: without them as inputs, a change
	// to the catalog or to a module's dependencies alone would leave the test task up to date.
	inputs.file(file('../modules.yml')).withPropertyName('moduleCatalog')
	inputs.files(file('settings.gradle'), fileTree('modules') { include '*/build.gradle' }).withPropertyName('moduleBuildFiles')
	// The condition language's fixtures, shared with the Rust implementation in compute/condition-expression.
	inputs.dir(file('../compute/condition-expression/fixtures')).withPropertyName('conditionFixtures')
	// The sequence optimizer's evaluation set, whose baselines SequenceFixtureTest checks (compute/sequence-optimizer).
	inputs.dir(file('../compute/sequence-optimizer/fixtures')).withPropertyName('sequenceFixtures')
	// The flow kernel's fixtures, whose answers FlowKernelFixtureTest writes and checks (compute/flow-kernel, ADR-040).
	inputs.dir(file('../compute/flow-kernel/fixtures')).withPropertyName('flowKernelFixtures')
	// -Dcondition.fixtures.update=true rewrites those fixtures' answers; -Dcondition.bench=true runs the timing comparison;
	// -Dsequence.fixtures.update=true rewrites the sequence optimizer's baselines; -Dflow.fixtures.update=true the flow
	// kernel's validation answers.
	// The published API contract OpenApiContractTest compares the served document with (docs/api/README.md).
	inputs.files(file('../docs/api/openapi.json')).withPropertyName('apiContract')
	['condition.fixtures.update', 'condition.bench', 'sequence.fixtures.update', 'flow.fixtures.update', 'flow.bench',
		'openapi.update'].each { name ->
		def value = providers.systemProperty(name).orNull
		if (value != null) systemProperty name, value
	}
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	violationRules {
		rule {
			element = 'BUNDLE'
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.45
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.30
			}
		}
		rule {
			element = 'PACKAGE'
			includes = [
				'org.myweb.flowmat.global.security',
				'org.myweb.flowmat.domain.project.application'
			]
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.50
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.25
			}
		}
	}
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

// The tests live in this project and exercise every module, so coverage is reported and checked over all of them.
def moduleClasses = files(contextModules.collect { it.layout.buildDirectory.dir('classes/java/main') })
def moduleSources = files(contextModules.collect { it.file('src/main/java') })
[tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')].each { coverageTask ->
	coverageTask.configure {
		classDirectories.from(moduleClasses)
		sourceDirectories.from(moduleSources)
	}
}

// Backend test selection (docs/operations/ci-selection.md §3). -PtestImpact.record writes, for each test class, the
// project classes it ran into build/test-impact; -PtestImpact.previous=<an earlier build/test-impact> also leaves out the
// classes whose last run passed against the same code. Off without the properties: a local run runs everything.
def testImpactDir = layout.buildDirectory.dir('test-impact')
def testImpactRecord = providers.gradleProperty('testImpact.record').isPresent()
def testImpactPrevious = providers.gradleProperty('testImpact.previous')
// What every test depends on besides the classes: resources (migrations, application settings), build files,
// fixtures read from disk, and the libraries on the test class path. Any change runs every test class.
def testImpactKey = {
	def digest = java.security.MessageDigest.getInstance('SHA-256')
	def inputs = files(
		fileTree('src/main/resources'), fileTree('src/test/resources'),
		fileTree('modules') { include '*/src/main/resources/**', '*/src/test/resources/**', '*/build.gradle' },
		'build.gradle', 'settings.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', '../modules.yml',
		fileTree('../compute/condition-expression/fixtures'), fileTree('../compute/sequence-optimizer/fixtures'),
		fileTree('../compute/flow-kernel/fixtures'))
	inputs.files.findAll { it.isFile() }.sort { it.absolutePath }.each { input ->
		digest.update(projectDir.toPath().relativize(input.toPath()).toString().getBytes('UTF-8'))
		digest.update(input.bytes)
	}
	configurations.testRuntimeClasspath.files.findAll { !it.absolutePath.startsWith(projectDir.absolutePath) }
		.collect { it.name }.sort().each { digest.update(it.getBytes('UTF-8')) }
	digest.digest().encodeHex().toString()
}
if (testImpactRecord) {
	def testImpactOut = testImpactDir.get().asFile
	tasks.named('test') {
		systemProperty 'testImpact.out', testImpactOut.absolutePath
		// Starts the shared context and checks the schema, whatever else is left out. The API contract test too:
		// springdoc only reflects on controllers, so a changed controller would not mark it to run.
		systemProperty 'testImpact.alwaysRun', 'org.myweb.flowmat.FlowMatSmokeTest,org.myweb.flowmat.OpenApiContractTest'
		if (testImpactPrevious.isPresent()) {
			systemProperty 'testImpact.previous', file(testImpactPrevious.get()).absolutePath
			// When every class already passed, nothing is left to discover but the smoke test.
			failOnNoDiscoveredTests = false
		}
		def classDirs = sourceSets.main.output.classesDirs + sourceSets.test.output.classesDirs + moduleClasses
		jvmArgumentProviders.add({ ["-DtestImpact.key=${testImpactKey()}".toString(),
			"-DtestImpact.classDirs=${classDirs.asPath}".toString()] } as CommandLineArgumentProvider)
		outputs.dir(testImpactOut).withPropertyName('testImpact')
		doFirst { project.delete(testImpactOut) }
	}
	// The listener resets the agent at each class, so the coverage is the sum of the pieces it wrote, including the
	// pieces of classes left out (copied from their last run: the classes they ran are unchanged).
	[tasks.named('jacocoTestReport'), tasks.named('jacocoTestCoverageVerification')].each { coverageTask ->
		coverageTask.configure {
			executionData.from(fileTree(testImpactOut) { include 'exec/*.exec' })
		}
	}
}

dependencyCheck {
	formats = ['HTML', 'SARIF', 'JSON']
	// Kept under the Gradle user home so CI can cache it between weekly runs (security.yml).
	data {
		directory = "${gradle.gradleUserHomeDir}/dependency-check-data"
	}
	nvd {
		// CI passes an empty value when the NVD_API_KEY secret is not set, and the NVD client refuses an empty key
		// ("Invalid API Key, length of 0"), which failed every weekly scan. An empty key now means no key: the sync then
		// keeps to NVD's rate for anonymous clients (5 requests in 30 s), slow the first time and quick from the cache.
		def key = System.getenv('NVD_API_KEY')?.trim()
		apiKey = key ?: null
		if (!key) delay = 8000
	}
}
