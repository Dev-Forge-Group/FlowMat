spring:
  application:
    name: flowmat
  servlet:
    multipart:
      max-file-size: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}B
      max-request-size: ${STORAGE_MAX_REQUEST_SIZE_BYTES:11534336}B
  # No default profile on purpose: an install that forgets to name one must not run as dev, which keeps the demo account
  # and its known password (V18 removes the demo rows only when flowmat.demo_seed_enabled is not 'true'). Run locally
  # with --spring.profiles.active=dev (docs/local-development.md); deploy with prod.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 2000
      timeout: 2000
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:3600}
  refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}

server:
  # Tomcat applies X-Forwarded-For only from trusted (internal) proxies; the app never reads the header itself.
  forward-headers-strategy: native
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}

app:
  storage:
    type: ${STORAGE_TYPE:local}
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE_BYTES:10485760}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-region: ${STORAGE_S3_REGION:us-east-1}
    s3-endpoint: ${STORAGE_S3_ENDPOINT:}
    s3-path-style: ${STORAGE_S3_PATH_STYLE:false}
  auth:
    login-rate-limit:
      account-limit: ${AUTH_LOGIN_ACCOUNT_LIMIT:8}
      ip-limit: ${AUTH_LOGIN_IP_LIMIT:12}
    # Off unless explicitly enabled (2026-11-01 user decision, ADR-030).
    face-login:
      enabled: ${APP_AUTH_FACE_LOGIN_ENABLED:false}
  frontend-url: ${FRONTEND_URL}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  workflow-collab:
    graph:
      retention: ${APP_WORKFLOW_COLLAB_GRAPH_RETENTION:P31D}
      key-ttl: ${APP_WORKFLOW_COLLAB_GRAPH_KEY_TTL:P35D}
    presence:
      heartbeat-timeout: ${APP_WORKFLOW_COLLAB_PRESENCE_HEARTBEAT_TIMEOUT:PT45S}
      cleanup-interval: ${APP_WORKFLOW_COLLAB_PRESENCE_CLEANUP_INTERVAL:PT15S}

logging:
  level:
    org.hibernate.SQL: info
    org.apache.hc.client5.http: 'OFF'
    org.apache.hc.core5.http: 'OFF'
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%X{userId:-anon}] [%X{projectId:-no-project}] [%X{workflowId:-no-workflow}] [%X{runId:-no-run}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# OAuth2 provider templates.
# Enable a provider by setting its env vars.
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# KAKAO_CLIENT_ID / KAKAO_CLIENT_SECRET
# GOOGLE_REDIRECT_URI / KAKAO_REDIRECT_URI

---
spring:
  config:
    activate:
      on-profile: "dev & !prod"
  flyway:
    init-sqls:
      - SET flowmat.demo_seed_enabled = 'true'

---
# Production: the actuator moves to its own management port (2026-11-01 user decision, ADR-029).
# Keep that port off the public network (container network, firewall or proxy ACL);
# MANAGEMENT_SERVER_ADDRESS binds it to one interface. The public port keeps only status probes.
spring:
  config:
    activate:
      on-profile: prod
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
