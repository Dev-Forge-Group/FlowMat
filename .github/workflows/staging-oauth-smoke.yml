name: Staging OAuth Smoke

on:
  workflow_dispatch:

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  oauth-smoke:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: flowmat_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: flowmat_frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: flowmat_frontend
        run: npx playwright install --with-deps chromium

      - name: Run real provider callback smoke
        working-directory: flowmat_frontend
        env:
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          STAGING_OAUTH_CALLBACK_URL: ${{ secrets.STAGING_OAUTH_CALLBACK_URL }}
        run: |
          test -n "$BASE_URL"
          test -n "$STAGING_OAUTH_CALLBACK_URL"
          npx playwright test e2e/staging-oauth.spec.ts
