name: Frontend Tests & Lint

# Runs only when the frontend, the module catalog or condition fixtures its tests read, or this file changes, because Actions minutes
# are limited. A backend or docs change does not change these results.
on:
  push:
    branches: [ main, develop, 'release-validation/**' ]
    paths:
      - 'flowmat_frontend/**'
      - 'modules.yml'
      # conditionLanguage.test.ts runs the editor's condition checker on these.
      - 'compute/condition-expression/fixtures/**'
      # flowKernel.test.ts and toKernelGraph.test.ts run the editor's flow kernel on these.
      - 'compute/flow-kernel/fixtures/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_frontend/**'
      - 'modules.yml'
      # conditionLanguage.test.ts runs the editor's condition checker on these.
      - 'compute/condition-expression/fixtures/**'
      # flowKernel.test.ts and toKernelGraph.test.ts run the editor's flow kernel on these.
      - 'compute/flow-kernel/fixtures/**'
      - '.github/workflows/frontend.yml'
  # Runs it whatever changed.
  workflow_dispatch:

# A newer push to the same pull request replaces the older run. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_frontend

    strategy:
      matrix:
        # Vite 8 and Vitest 5 require Node >=22.12.0.
        node-version: [22.x]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: flowmat_frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit -p tsconfig.json

    - name: Type check browser tests
      run: npx tsc --noEmit -p tsconfig.e2e.json

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build

    - name: Install Playwright browser
      if: matrix.node-version == '22.x'
      run: npx playwright install --with-deps chromium

    - name: Run mocked authentication E2E
      if: matrix.node-version == '22.x'
      env:
        E2E_WEB_SERVER: preview
      run: npm run test:e2e -- e2e/auth.spec.ts e2e/session-cache-isolation.spec.ts
