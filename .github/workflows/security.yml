name: Security Scan - Dependencies

# On a push or a pull request, npm audit runs only when the frontend's dependencies change. New advisories for
# unchanged dependencies are caught by the weekly run.
on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [ main, develop ]
    paths:
      - 'flowmat_frontend/package.json'
      - 'flowmat_frontend/package-lock.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_frontend/package.json'
      - 'flowmat_frontend/package-lock.json'
      - '.github/workflows/security.yml'
  workflow_dispatch:

# A newer push to the same pull request replaces the older run. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_frontend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Use Node.js 22.x
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: flowmat_frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate

  gradle-dependency-check:
    # The NVD sync is slow, so run the OWASP scan only on the weekly schedule or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Without an NVD_API_KEY secret the first sync of the vulnerability data takes a long while; the cache below keeps it.
    # Not a pull request check: a pull request never waits for NVD (docs/operations/ci-selection.md).
    timeout-minutes: 150
    defaults:
      run:
        working-directory: flowmat_backend

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Restore the vulnerability data
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.gradle/dependency-check-data
        key: dependency-check-data-${{ github.run_id }}
        restore-keys: dependency-check-data-

    # The scan fails only when it cannot run; findings are listed by the next step and judged for a release
    # (docs/status/RELEASE-CHECKLIST.md). When NVD cannot be reached or refuses the key, the error says so, so it is not
    # read as a finding.
    - name: Run OWASP dependency check
      run: |
        set +e
        [ -n "$NVD_API_KEY" ] || unset NVD_API_KEY
        ./gradlew dependencyCheckAnalyze 2>&1 | tee /tmp/dependency-check.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ] && grep -qE 'NvdApiException|Error updating the NVD Data' /tmp/dependency-check.log; then
          if grep -q 'Invalid API Key' /tmp/dependency-check.log; then
            reason='NVD refused the NVD_API_KEY secret: it is not an activated API key'
          else
            reason='NVD did not answer (rate limit or outage)'
          fi
          message="The vulnerability data could not be downloaded: $reason. Nothing was scanned, so this is not a finding."
          echo "::error title=Vulnerability data unavailable::$message"
          { echo '### OWASP dependency check did not run'; echo; echo "$message"; } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: List findings
      if: always()
      run: |
        python3 - <<'PY'
        import json, os, pathlib
        report = pathlib.Path('build/reports/dependency-check-report.json')
        if not report.exists():
            raise SystemExit(0)
        counts, serious = {}, []
        for dependency in json.loads(report.read_text()).get('dependencies', []):
            for vulnerability in dependency.get('vulnerabilities', []):
                severity = (vulnerability.get('severity') or 'UNKNOWN').upper()
                counts[severity] = counts.get(severity, 0) + 1
                if severity in ('HIGH', 'CRITICAL'):
                    serious.append(f"| {dependency.get('fileName')} | {vulnerability.get('name')} | {severity} |")
        lines = ['### OWASP dependency check', '', 'Findings by severity: '
                 + (', '.join(f'{name} {count}' for name, count in sorted(counts.items())) or 'none'), '']
        if serious:
            lines += ['| Dependency | Vulnerability | Severity |', '|---|---|---|', *sorted(set(serious))]
            print(f'::warning title=High or critical findings::{len(set(serious))} to judge before a release')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
            summary.write('\n'.join(lines) + '\n')
        print('\n'.join(lines))
        PY

    - name: Upload dependency-check report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dependency-check-report
        path: flowmat_backend/build/reports/dependency-check-report.*
        if-no-files-found: ignore
