name: Security Scan - Dependencies

# On a push or a pull request, npm audit runs only when the frontend's dependencies change. New advisories for
# unchanged dependencies are caught by the weekly run.
on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  push:
    branches: [ main, develop ]
    paths:
      - 'flowmat_frontend/package.json'
      - 'flowmat_frontend/package-lock.json'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_frontend/package.json'
      - 'flowmat_frontend/package-lock.json'
      - '.github/workflows/security.yml'
  workflow_dispatch:

# A newer push to the same pull request replaces the older run. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: flowmat_frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level=moderate

  gradle-dependency-check:
    # The NVD sync is slow, so run the OWASP scan only on the weekly schedule or on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Run OWASP dependency check
      run: ./gradlew dependencyCheckAnalyze
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    - name: Upload dependency-check report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: flowmat_backend/build/reports/dependency-check-report.*
        if-no-files-found: ignore
