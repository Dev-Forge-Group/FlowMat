          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/instruction-quality-real-api.spec.ts e2e/inventory-reports.spec.ts --pass-with-no-tests --workers=1 --retries=0 --trace=off

      # As in the mocked job: each failed check's page, and the backend's last warnings and errors, go into the log.
      - name: Show failed pages and backend warnings
        if: failure()
        working-directory: flowmat_frontend
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            sed -n '1,250p' "$file"
            echo "::endgroup::"
          done || true
          echo "::group::backend warnings and errors"
          grep -E ' (WARN|ERROR) ' /tmp/flowmat-backend.log | tail -n 80 || true
          echo "::endgroup::"

      # Spec files that passed are recorded with what they loaded; a failure is recorded too, so it runs again.
      - name: Record passed specs
        if: ${{ !cancelled() }}
        working-directory: flowmat_frontend
        run: |
          node e2e/support/already-passed/select.mjs record --scope real --extra "$E2E_EXTRA" \
            --records playwright-results/already-passed/passed-1.json --records playwright-results/already-passed/passed-2.json \
            --chunks "$E2E_CHUNK_MAP" --assets "$E2E_ASSET_LOG" --tests "$E2E_PASSED_LOG" \
            --out playwright-results/already-passed/passed-${{ matrix.shard }}.json
      - name: Save passed specs
        if: ${{ !cancelled() }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: flowmat_frontend/playwright-results/already-passed/passed-${{ matrix.shard }}.json
          key: e2e-passed-real-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-backend-log-${{ matrix.shard }}
          path: /tmp/flowmat-backend.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-playwright-artifacts-${{ matrix.shard }}
          path: |
            flowmat_frontend/test-results
            flowmat_frontend/playwright-report
          if-no-files-found: ignore
