name: Browser E2E with Backend Services

# The real-backend browser checks run when the backend, the frontend, the scripts and fixtures they use, or this file
# changes. The mocked browser checks need only the frontend and are in mock-e2e.yml.
#
# A pull request leaves out the spec files that already passed against the same code (docs/operations/ci-selection.md):
# the same backend, scripts and this file, the same spec and support files, the same built frontend files loaded. When
# every spec here already passed, the backend is not started at all. The merge to main does not run them again; every
# spec runs each night on main, and on a manual run.
on:
  push:
    branches: [ 'release-validation/**' ]
    paths:
      - 'flowmat_backend/**'
      - 'flowmat_frontend/**'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_backend/**'
      - 'flowmat_frontend/**'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  schedule:
    # Every spec, each night on main (docs/operations/ci-selection.md).
    - cron: '13 18 * * *'
  workflow_dispatch:

# A newer push to the same pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  # Decides whether any spec here still has to run, before a backend is started for them.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore passed specs (shard 1)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: flowmat_frontend/playwright-results/already-passed/passed-1.json
          key: e2e-passed-real-1-${{ github.run_id }}
          restore-keys: e2e-passed-real-1-
      - name: Restore passed specs (shard 2)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: flowmat_frontend/playwright-results/already-passed/passed-2.json
          key: e2e-passed-real-2-${{ github.run_id }}
          restore-keys: e2e-passed-real-2-
      - name: Choose the specs to run
        id: plan
        working-directory: flowmat_frontend
        env:
          FULL: ${{ github.event_name != 'pull_request' && '--full' || '' }}
        run: |
          extra="$(git rev-parse HEAD:flowmat_backend HEAD:scripts | tr '\n' ' ')$(git hash-object ../.github/workflows/browser-e2e.yml)"
          echo "E2E_EXTRA=$extra" >> "$GITHUB_ENV"
          node e2e/support/already-passed/select.mjs plan --scope real --extra "$extra" $FULL \
            --records playwright-results/already-passed/passed-1.json --records playwright-results/already-passed/passed-2.json \
            --out playwright-results/already-passed/skip.json
          echo "E2E_SKIP_FILE=$PWD/playwright-results/already-passed/skip.json" >> "$GITHUB_ENV"
          left=$(grep -o 'e2e/[A-Za-z0-9_-]*\.spec\.ts' ../.github/workflows/browser-e2e.yml | sort -u \
            | node -e "const skip = new Set(JSON.parse(require('fs').readFileSync('playwright-results/already-passed/skip.json', 'utf8')).skip); console.log(require('fs').readFileSync(0, 'utf8').split('\\n').filter((file) => file && !skip.has(file)).length)")
          echo "Spec files to run: $left"
          echo "run=$([ "$left" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Two shards, each with its own backend and database, run half of the spec steps at the same time. The specs make their
  # own data on the demo project, so a shard needs nothing from the other.
  browser-e2e:
    name: browser-e2e (${{ matrix.shard }}/2)
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_WEB_SERVER: preview
      E2E_CHUNK_MAP: playwright-results/already-passed/chunk-map.json
      E2E_ASSET_LOG: playwright-results/already-passed/requests.log
      E2E_PASSED_LOG: playwright-results/already-passed/tests.jsonl
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowmat
          POSTGRES_USER: flowmat
          POSTGRES_PASSWORD: flowmat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmat -d flowmat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Restore passed specs (shard 1)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: flowmat_frontend/playwright-results/already-passed/passed-1.json
          key: e2e-passed-real-1-${{ github.run_id }}
          restore-keys: e2e-passed-real-1-
      - name: Restore passed specs (shard 2)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: flowmat_frontend/playwright-results/already-passed/passed-2.json
          key: e2e-passed-real-2-${{ github.run_id }}
          restore-keys: e2e-passed-real-2-
      - name: Choose the specs to run
        working-directory: flowmat_frontend
        env:
          FULL: ${{ github.event_name != 'pull_request' && '--full' || '' }}
        run: |
          extra="$(git rev-parse HEAD:flowmat_backend HEAD:scripts | tr '\n' ' ')$(git hash-object ../.github/workflows/browser-e2e.yml)"
          echo "E2E_EXTRA=$extra" >> "$GITHUB_ENV"
          node e2e/support/already-passed/select.mjs plan --scope real --extra "$extra" $FULL \
            --records playwright-results/already-passed/passed-1.json --records playwright-results/already-passed/passed-2.json \
            --out playwright-results/already-passed/skip.json
          echo "E2E_SKIP_FILE=$PWD/playwright-results/already-passed/skip.json" >> "$GITHUB_ENV"
          left=$(grep -o 'e2e/[A-Za-z0-9_-]*\.spec\.ts' ../.github/workflows/browser-e2e.yml | sort -u \
            | node -e "const skip = new Set(JSON.parse(require('fs').readFileSync('playwright-results/already-passed/skip.json', 'utf8')).skip); console.log(require('fs').readFileSync(0, 'utf8').split('\\n').filter((file) => file && !skip.has(file)).length)")
          echo "Spec files to run: $left"
          echo "run=$([ "$left" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Node.js 22.22.3
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: flowmat_frontend/package-lock.json

      - name: Run connector reference Node tests
        run: node --test scripts/connector-reference-api.test.mjs scripts/connector-reference-flow.test.mjs

      # Compile first so the readiness wait below only covers application startup, not the first build of
      # every module on a fresh runner.
      - name: Build backend
        working-directory: flowmat_backend
        run: ./gradlew classes

      # A stand-in for another company's system for the integration jobs test. The connector refuses loopback, so it
      # listens on this runner's private address, and the backend approves only that one origin over plain HTTP.
      - name: Start integration jobs target
        run: |
          nohup node scripts/integration-target.mjs > /tmp/integration-target.log 2>&1 &
          for attempt in {1..20}; do
            grep -q '^INTEGRATION_TARGET_ORIGIN=' /tmp/integration-target.log && break
            sleep 0.5
          done
          origin=$(grep -m1 '^INTEGRATION_TARGET_ORIGIN=' /tmp/integration-target.log | cut -d= -f2-)
          if [ -z "$origin" ]; then cat /tmp/integration-target.log; exit 1; fi
          host=${origin#http://}
          host=${host%%:*}
          {
            echo "INTEGRATION_TARGET_ORIGIN=$origin"
            echo "FLOWMAT_CONNECTOR_ENABLED=true"
            echo "FLOWMAT_CONNECTOR_ALLOWPRIVATEHTTP=true"
            echo "FLOWMAT_CONNECTOR_ALLOWEDORIGINS=$origin"
            echo "FLOWMAT_CONNECTOR_PRIVATECIDRS=$host/32"
          } >> "$GITHUB_ENV"

      - name: Start backend
        working-directory: flowmat_backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/flowmat
          DB_USERNAME: flowmat
          DB_PASSWORD: flowmat-ci-password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          AUTH_LOGIN_ACCOUNT_LIMIT: '100'
          AUTH_LOGIN_IP_LIMIT: '200'
          MAIL_HOST: localhost
          MAIL_PORT: '2525'
          MAIL_USERNAME: ci
          MAIL_PASSWORD: ci-password
          JWT_SECRET: ci-secret-that-is-long-enough-for-tests
          FRONTEND_URL: http://127.0.0.1:4173
          APP_OAUTH2_REDIRECT_URI: http://127.0.0.1:4173/oauth2/success
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=dev --server.port=8080' > /tmp/flowmat-backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flowmat-backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: flowmat_frontend
        run: npm ci

      - name: Build frontend for E2E
        working-directory: flowmat_frontend
        run: npm run build

      - name: Verify backend API contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/actuator/health/readiness

      - name: Install Playwright browser
        working-directory: flowmat_frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend contract E2E
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/backend-contract.spec.ts --pass-with-no-tests

      - name: Run real Data Flow browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/data-flow-browser.spec.ts --pass-with-no-tests --workers=1

      - name: Run real worked time browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_LABOR_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/run-labor-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0

      - name: Run real working delay browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_WORKING_DELAY_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/working-delay-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0

      - name: Run real organization browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_ORG_E2E_DISPOSABLE: '1'
          FLOWMAT_ORG_E2E_MEMBER_ID: org-e2e-member
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.org_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/organization-e2e-fixture.sql
          npm run test:e2e -- e2e/organizations-real-api.spec.ts --pass-with-no-tests --workers=1 --trace=off

      - name: Run real approval notification browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_APPROVAL_E2E_DISPOSABLE: '1'
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.approval_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/approval-notification-e2e-fixture.sql
          npm run test:e2e -- e2e/approval-notification-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0 --trace=off

      - name: Run real execution policy and notification browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_NOTIFICATION_E2E_DISPOSABLE: '1'
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.notification_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/notification-e2e-fixture.sql
          npm run test:e2e -- e2e/execution-policy-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0 --trace=off
          npm run test:e2e -- e2e/stock-alert-notification-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0 --trace=off
          # The recipient test removes viewer membership, so run it last.
          npm run test:e2e -- e2e/notification-reorder-real-api.spec.ts --pass-with-no-tests --workers=1 --retries=0 --trace=off

      - name: Run real worker planning browser acceptance
        if: matrix.shard == 1
        working-directory: flowmat_frontend
        env:
