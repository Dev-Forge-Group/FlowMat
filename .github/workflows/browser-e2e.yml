name: Browser E2E with Backend Services

# The real-backend browser checks run when the backend, the frontend, the scripts and fixtures they use, or this file
# changes. The mocked browser checks need only the frontend and are in mock-e2e.yml.
on:
  push:
    branches: [ main, develop, 'release-validation/**' ]
    paths:
      - 'flowmat_backend/**'
      - 'flowmat_frontend/**'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_backend/**'
      - 'flowmat_frontend/**'
      - 'scripts/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

# A newer push to the same pull request replaces the older run. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_WEB_SERVER: preview
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flowmat
          POSTGRES_USER: flowmat
          POSTGRES_PASSWORD: flowmat-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmat -d flowmat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle

      - name: Set up Node.js 22.22.3
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: flowmat_frontend/package-lock.json

      - name: Run connector reference Node tests
        run: node --test scripts/connector-reference-api.test.mjs scripts/connector-reference-flow.test.mjs

      # Compile first so the readiness wait below only covers application startup, not the first build of
      # every module on a fresh runner.
      - name: Build backend
        working-directory: flowmat_backend
        run: ./gradlew classes

      - name: Start backend
        working-directory: flowmat_backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/flowmat
          DB_USERNAME: flowmat
          DB_PASSWORD: flowmat-ci-password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          AUTH_LOGIN_ACCOUNT_LIMIT: '100'
          AUTH_LOGIN_IP_LIMIT: '200'
          MAIL_HOST: localhost
          MAIL_PORT: '2525'
          MAIL_USERNAME: ci
          MAIL_PASSWORD: ci-password
          JWT_SECRET: ci-secret-that-is-long-enough-for-tests
          FRONTEND_URL: http://127.0.0.1:4173
          APP_OAUTH2_REDIRECT_URI: http://127.0.0.1:4173/oauth2/success
          APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
        run: |
          nohup ./gradlew bootRun --args='--spring.profiles.active=dev --server.port=8080' > /tmp/flowmat-backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/flowmat-backend.log
          exit 1

      - name: Install frontend dependencies
        working-directory: flowmat_frontend
        run: npm ci

      - name: Build frontend for E2E
        working-directory: flowmat_frontend
        run: npm run build

      - name: Verify backend API contract
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/actuator/health/readiness

      - name: Install Playwright browser
        working-directory: flowmat_frontend
        run: npx playwright install --with-deps chromium

      - name: Run real backend contract E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/backend-contract.spec.ts

      - name: Run real Data Flow browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/data-flow-browser.spec.ts --workers=1

      - name: Run real worked time browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_LABOR_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/run-labor-real-api.spec.ts --workers=1 --retries=0

      - name: Run real working delay browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_WORKING_DELAY_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/working-delay-real-api.spec.ts --workers=1 --retries=0

      - name: Run real organization browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_ORG_E2E_DISPOSABLE: '1'
          FLOWMAT_ORG_E2E_MEMBER_ID: org-e2e-member
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.org_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/organization-e2e-fixture.sql
          npm run test:e2e -- e2e/organizations-real-api.spec.ts --workers=1 --trace=off

      - name: Run real approval notification browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_APPROVAL_E2E_DISPOSABLE: '1'
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.approval_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/approval-notification-e2e-fixture.sql
          npm run test:e2e -- e2e/approval-notification-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real execution policy and notification browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_NOTIFICATION_E2E_DISPOSABLE: '1'
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.notification_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/notification-e2e-fixture.sql
          npm run test:e2e -- e2e/execution-policy-real-api.spec.ts --workers=1 --retries=0 --trace=off
          npm run test:e2e -- e2e/stock-alert-notification-real-api.spec.ts --workers=1 --retries=0 --trace=off
          # The recipient test removes viewer membership, so run it last.
          npm run test:e2e -- e2e/notification-reorder-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real worker planning browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_WORKER_E2E_DISPOSABLE: '1'
          PGPASSWORD: flowmat-ci-password
          PGOPTIONS: '-c flowmat.worker_e2e_disposable=true'
        run: |
          psql --host=127.0.0.1 --port=5432 --username=flowmat --dbname=flowmat --set=ON_ERROR_STOP=1 --file=../scripts/ci/worker-planning-e2e-fixture.sql
          npm run test:e2e -- e2e/worker-planning-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real Exclusive gateway browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_GATEWAY_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/exclusive-gateway-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real gateway quantity browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_GATEWAY_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/gateway-quantity-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real transfer, equipment limit and production step acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_FEATURE_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/gateway-delay-real-api.spec.ts e2e/equipment-concurrency-limit-real-api.spec.ts e2e/production-steps-real-api.spec.ts e2e/worker-schedule-history-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real worker rota browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_ROTA_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/worker-rota-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real equipment capacity browser acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
          FLOWMAT_EQUIPMENT_E2E_DISPOSABLE: '1'
        run: npm run test:e2e -- e2e/equipment-capacity-real-api.spec.ts --workers=1 --retries=0 --trace=off

      - name: Run real BOM and LOT E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/bom-lot-flow.spec.ts

      - name: Run real LOT genealogy E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/lot-genealogy.spec.ts

      - name: Run real storage location E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/storage-locations.spec.ts

      - name: Run real inspection standard E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/inspection-standards.spec.ts

      - name: Run real nonconformity E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/nonconformity.spec.ts

      - name: Run real warehouse task E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/warehouse-tasks.spec.ts

      - name: Run real purchase and warehouse recovery E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/purchase-warehouse-live.spec.ts

      - name: Run real production and quality journey E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/production-quality-live.spec.ts

      - name: Run real workflow validation E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/workflow-validation.spec.ts

      - name: Run real equipment schedule E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/equipment-schedule.spec.ts

      - name: Run real equipment changeover E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/equipment-changeover.spec.ts

      - name: Run real equipment load E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/equipment-load.spec.ts

      - name: Run real work instruction E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/work-instructions.spec.ts

      - name: Run real stock allocation E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/stock-allocations.spec.ts

      - name: Run real data port E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/data-ports.spec.ts

      - name: Run real work order plan E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/work-order-plan.spec.ts

      - name: Run real NCR from defects E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/ncr-from-defects.spec.ts

      - name: Run real receipt checklist E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/receipt-checklist.spec.ts

      - name: Run real revision retire E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/revision-retire.spec.ts

      - name: Run real equipment days E2E
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/equipment-days.spec.ts

      - name: Run real instruction quality and inventory report acceptance
        working-directory: flowmat_frontend
        env:
          REAL_API_E2E: '1'
        run: npm run test:e2e -- e2e/instruction-quality-real-api.spec.ts e2e/inventory-reports.spec.ts --workers=1 --retries=0 --trace=off

      # As in the mocked job: each failed check's page, and the backend's last warnings and errors, go into the log.
      - name: Show failed pages and backend warnings
        if: failure()
        working-directory: flowmat_frontend
        run: |
          find test-results -name error-context.md 2>/dev/null | while read -r file; do
            echo "::group::$file"
            sed -n '1,250p' "$file"
            echo "::endgroup::"
          done || true
          echo "::group::backend warnings and errors"
          grep -E ' (WARN|ERROR) ' /tmp/flowmat-backend.log | tail -n 80 || true
          echo "::endgroup::"

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-backend-log
          path: /tmp/flowmat-backend.log
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-playwright-artifacts
          path: |
            flowmat_frontend/test-results
            flowmat_frontend/playwright-report
          if-no-files-found: ignore
