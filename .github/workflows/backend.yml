name: Backend Tests & Build

# Runs only when the backend, the module catalog or condition fixtures its tests read, or this file changes, because
# Actions minutes are limited. A frontend or docs change does not change these results: the one thing here that reads the frontend, the
# catalog's folder paths, is checked by the frontend's own tests too.
on:
  push:
    branches: [ 'release-validation/**' ]
    paths:
      - 'flowmat_backend/**'
      - 'modules.yml'
      # ConditionExpressionFixtureTest checks Java against these.
      - 'compute/condition-expression/fixtures/**'
      # SequenceFixtureTest checks the sequence optimizer's baselines against SequenceCost.
      - 'compute/sequence-optimizer/fixtures/**'
      - 'compute/flow-kernel/fixtures/**'
      # OpenApiContractTest compares the served API with this contract.
      - 'docs/api/openapi.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_backend/**'
      - 'modules.yml'
      # ConditionExpressionFixtureTest checks Java against these.
      - 'compute/condition-expression/fixtures/**'
      # SequenceFixtureTest checks the sequence optimizer's baselines against SequenceCost.
      - 'compute/sequence-optimizer/fixtures/**'
      - 'compute/flow-kernel/fixtures/**'
      # OpenApiContractTest compares the served API with this contract.
      - 'docs/api/openapi.json'
      - '.github/workflows/backend.yml'
  schedule:
    # Every test, each night on main; a pull request already ran them before its merge (docs/operations/ci-selection.md).
    - cron: '7 18 * * *'
  # Runs it whatever changed.
  workflow_dispatch:

# A newer push to the same pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_backend

    # Integration tests (FlowMatSmokeTest, ProjectAccessIntegrationTest) start their own Postgres and
    # Redis through Testcontainers using the runner's Docker, so no service containers are needed here.
    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
    # A pull request leaves out the test classes that already passed against the same code: every project class they
    # ran is unchanged, and so are resources, build files, fixtures, libraries and anything that shapes every test
    # (docs/operations/ci-selection.md §3). Each night and a manual run run them all and record afresh.
    - name: Restore the test record
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: flowmat_backend/build/test-impact
        key: backend-test-impact-${{ github.run_id }}
        restore-keys: backend-test-impact-
    - name: Choose the test classes
      run: |
        args='-PtestImpact.record=true'
        if [ -d build/test-impact/records ]; then
          mv build/test-impact build/test-impact-previous
          args="$args -PtestImpact.previous=build/test-impact-previous"
        fi
        echo "TEST_IMPACT_ARGS=$args" >> "$GITHUB_ENV"

    - name: Run tests
      run: ./gradlew test $TEST_IMPACT_ARGS

    - name: Show the test classes left out
      if: ${{ !cancelled() }}
      run: |
        left=$(cat build/test-impact/left-out.txt 2>/dev/null | wc -l)
        ran=$(ls build/test-results/test/*.xml 2>/dev/null | wc -l)
        line="$ran test classes ran; $left already passed against the same code and were left out."
        if [ -s build/test-impact/run-all.txt ]; then line="$line All ran because $(cat build/test-impact/run-all.txt)."; fi
        echo "$line"
        { echo '### Backend tests'; echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"

    # The same arguments, so the test task is up to date and the coverage counts the classes left out as well.
    - name: Verify coverage gate
      run: ./gradlew jacocoTestCoverageVerification $TEST_IMPACT_ARGS

    - name: Save the test record
      if: ${{ !cancelled() }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: flowmat_backend/build/test-impact
        key: backend-test-impact-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Build
      run: ./gradlew build -x test

    - name: Preserve test and coverage reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: backend-reports-java-${{ matrix.java-version }}
        path: |
          flowmat_backend/build/test-results/test/
          flowmat_backend/build/reports/tests/test/
          flowmat_backend/build/reports/jacoco/test/
        if-no-files-found: warn
        retention-days: 7

    - name: Upload coverage to Codecov
      id: codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      # The external upload is optional; downloader errors must not fail the build.
      continue-on-error: true
      timeout-minutes: 3
      with:
        files: flowmat_backend/build/reports/jacoco/test/jacocoTestReport.xml
        flags: backend
        fail_ci_if_error: false

    - name: Report Codecov upload failure
      if: always() && steps.codecov.outcome == 'failure'
      run: echo '::warning::Optional Codecov upload failed. Tests, coverage verification and build remain required.'
