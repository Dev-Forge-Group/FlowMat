name: Backend Tests & Build

# Runs only when the backend, the module catalog its tests read, or this file changes, because Actions minutes are
# limited. A frontend or docs change does not change these results: the one thing here that reads the frontend, the
# catalog's folder paths, is checked by the frontend's own tests too.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'flowmat_backend/**'
      - 'modules.yml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'flowmat_backend/**'
      - 'modules.yml'
      - '.github/workflows/backend.yml'
  # Runs it whatever changed.
  workflow_dispatch:

# A newer push to the same pull request replaces the older run. Each push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowmat_backend

    # Integration tests (FlowMatSmokeTest, ProjectAccessIntegrationTest) start their own Postgres and
    # Redis through Testcontainers using the runner's Docker, so no service containers are needed here.
    strategy:
      matrix:
        java-version: ['21']

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Run tests
      run: ./gradlew test

    - name: Verify coverage gate
      run: ./gradlew jacocoTestCoverageVerification

    - name: Build
      run: ./gradlew build -x test

    - name: Preserve test and coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-reports-java-${{ matrix.java-version }}
        path: |
          flowmat_backend/build/test-results/test/
          flowmat_backend/build/reports/tests/test/
          flowmat_backend/build/reports/jacoco/test/
        if-no-files-found: warn
        retention-days: 7

    - name: Upload coverage to Codecov
      id: codecov
      uses: codecov/codecov-action@v5
      # The external upload is optional; downloader errors must not fail the build.
      continue-on-error: true
      timeout-minutes: 3
      with:
        files: flowmat_backend/build/reports/jacoco/test/jacocoTestReport.xml
        flags: backend
        fail_ci_if_error: false

    - name: Report Codecov upload failure
      if: always() && steps.codecov.outcome == 'failure'
      run: echo '::warning::Optional Codecov upload failed. Tests, coverage verification and build remain required.'
