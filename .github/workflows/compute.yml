name: Compute (Rust)

# The Rust crates in compute/: the condition language (compute/condition-expression) and the flow kernel
# (compute/flow-kernel). Runs when a crate or its shared fixtures change; the backend workflow checks the Java side of
# the same fixtures.
on:
  push:
    branches: [ 'release-validation/**' ]
    paths:
      - 'compute/**'
      - 'flowmat_frontend/src/shared/wasm/**'
      - '.github/workflows/compute.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'compute/**'
      - 'flowmat_frontend/src/shared/wasm/**'
      - '.github/workflows/compute.yml'
  schedule:
    # Each night on main; a pull request already ran this before its merge (docs/operations/ci-selection.md).
    - cron: '33 17 * * *'
  # Runs it whatever changed.
  workflow_dispatch:

# A newer push to the same pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  condition-expression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute/condition-expression

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    # rustup is on the runner; with no arguments it installs the version, components and target that
    # rust-toolchain.toml names.
    - name: Rust toolchain
      run: rustup toolchain install

    - name: Format
      run: cargo fmt --check

    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Lint the WebAssembly build
      run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

    - name: Test against the shared fixtures
      run: cargo test --locked

    - name: Build for WebAssembly
      run: cargo build --locked --release --lib --target wasm32-unknown-unknown

    - name: Use Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.x

    - name: Check the fixtures through the WebAssembly build
      run: node wasm/check-fixtures.mjs

  # The flow kernel (ADR-040): validation and routing against the answers Java writes into its fixtures. The backend
  # workflow checks the Java side of the same files.
  flow-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute/flow-kernel

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Rust toolchain
      run: rustup toolchain install

    - name: Format
      run: cargo fmt --check

    - name: Lint
      run: cargo clippy --locked --all-targets -- -D warnings

    - name: Lint the WebAssembly build
      run: cargo clippy --locked --lib --target wasm32-unknown-unknown -- -D warnings

    - name: Test against the shared fixtures
      run: cargo test --locked

    - name: Build for WebAssembly
      run: cargo build --locked --release --lib --target wasm32-unknown-unknown

    # The editor ships flowmat_frontend/src/shared/wasm/flowmat_flow_kernel.wasm; it must be what this source builds.
    - name: Check the editor's module against the source
      run: wasm/build.sh --check

    - name: Use Node.js 22
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.x

    - name: Check the fixtures through the WebAssembly build
      run: node wasm/check-fixtures.mjs

    # The editor's condition checker runs on the same module, which links the condition language in.
    - name: Check the condition fixtures through the editor's module
      run: node ../condition-expression/wasm/check-fixtures.mjs ../../flowmat_frontend/src/shared/wasm/flowmat_flow_kernel.wasm
