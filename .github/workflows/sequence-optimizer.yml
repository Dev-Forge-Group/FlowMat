name: Sequence optimizer (Python)

# The solver and evaluation for ordering one equipment's work orders (compute/sequence-optimizer, ADR-039). The backend's
# SequenceFixtureTest, in backend.yml, checks that fixtures/baselines.json is what the backend computes.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'compute/sequence-optimizer/**'
      - '.github/workflows/sequence-optimizer.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'compute/sequence-optimizer/**'
      - '.github/workflows/sequence-optimizer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The workflow token only reads; no job writes to the repository.
permissions:
  contents: read

jobs:
  sequence-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: compute/sequence-optimizer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: compute/sequence-optimizer/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Check the cost mirror and the solver
        run: python -m pytest -q tests
      - name: Check the fixtures are the generator's
        run: |
          python -m sequence_optimizer.generate
          git diff --exit-code -- fixtures/snapshots.json
      - name: Evaluate
        run: python -m sequence_optimizer.evaluate
      - name: Keep the evaluation table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sequence-evaluation
          path: compute/sequence-optimizer/results/
